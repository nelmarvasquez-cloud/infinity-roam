    /* Google Translate — visible solo si el usuario quiere cambiar manualmente */

<script>
  // ── Auto-traducción del blog de Soro según el idioma activo del sitio ──
  // Soro publica en un solo idioma a la vez (actualmente configurable en su panel).
  // Usamos el traductor de Google, aislado solo a #soro-blog-wrap (el resto de la
  // página ya tiene su propio sistema de idioma nativo vía data-i18n / ir_lang).
  (function () {
    var siteLang = localStorage.getItem("ir_lang") || "es";
    // "auto" detecta el idioma real del artículo de Soro (sin importar cuál sea
    // hoy en su panel) y lo traduce al idioma activo del sitio.
    var cookieValue = "/auto/" + siteLang;
    document.cookie = "googtrans=" + cookieValue + ";path=/";
    document.cookie = "googtrans=" + cookieValue + ";path=/;domain=" + location.hostname;

    window.googleTranslateElementInit = function () {
      new google.translate.TranslateElement(
        { pageLanguage: "auto", includedLanguages: "es,en", autoDisplay: false },
        "google_translate_element"
      );
    };

    function loadTranslateScript() {
      var s = document.createElement("script");
      s.src = "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
      document.head.appendChild(s);
    }

    // Se retrasa la descarga del script de Google Translate hasta que la página
    // ya terminó de cargar su contenido crítico (artículo de Soro, fuentes, etc.)
    // Esto evita que compita por ancho de banda durante el renderizado inicial,
    // mejorando el tiempo en que aparece el primer contenido visible (FCP).
    if (document.readyState === "complete") {
      loadTranslateScript();
    } else {
      window.addEventListener("load", loadTranslateScript);
    }

    // Si el usuario cambia el idioma del sitio mientras está en esta página,
    // actualiza la cookie y recarga para que el blog se re-traduzca.
    window.addEventListener("ir_lang_changed", function () {
      var newLang = localStorage.getItem("ir_lang") || "es";
      var v = "/auto/" + newLang;
      document.cookie = "googtrans=" + v + ";path=/";
      document.cookie = "googtrans=" + v + ";path=/;domain=" + location.hostname;
      location.reload();
    });
  })();
</script>

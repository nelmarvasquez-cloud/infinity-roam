[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Reintento automático del correo de eSIM cuando Zendit tarda en aprovisionar.
# Corre cada 5 minutos. Ver netlify/functions/retry-pending-esims.js
[functions."retry-pending-esims"]
  schedule = "*/5 * * * *"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "infinity-roam/zendit_tier2.json,infinity-roam/zendit_prices.json,infinity-roam/netlify/functions/offer_country.json,infinity-roam/netlify/functions/offer_region.json,zendit_tier2.json,zendit_prices.json,netlify/functions/offer_country.json,netlify/functions/offer_region.json"
  SECRETS_SCAN_OMIT_KEYS = "EMAILJS_PRIVATE_KEY"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

[[headers]]
  for = "/admin-ir.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/referral-signup.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/mi-credito.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/test-email.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"

# Defensa adicional: ningún archivo .md debe ser servible públicamente,
# aunque alguno vuelva a incluirse por error en un futuro deploy.
# Motivo: ANALYTICS_README.md quedó expuesto públicamente (documentaba
# arquitectura interna, nombres de variables de entorno y la existencia
# de admin-ir.html) — se removió del deploy, y esta regla evita que
# vuelva a pasar sin que nadie se dé cuenta.
[[redirects]]
  from = "/*.md"
  to = "/"
  status = 404
  force = true

  <style>
    .myesim-section {
      min-height: 100vh;
      padding: 120px 0 80px;
      background: #16223F;
    }
    .myesim-inner {
      max-width: 560px;
      margin: 0 auto;
      padding: 0 24px;
      text-align: center;
    }
    .myesim-form {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 32px;
      margin-top: 40px;
    }
    .myesim-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.4);
      margin-bottom: 10px;
      text-align: left;
    }
    .myesim-input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 14px 18px;
      font-family: var(--font);
      font-size: 0.95rem;
      color: white;
      outline: none;
      transition: all 0.3s;
      box-sizing: border-box;
      margin-bottom: 16px;
    }
    .myesim-input::placeholder { color: rgba(255,255,255,0.2); }
    .myesim-input:focus { border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.09); }
    .myesim-btn {
      width: 100%;
      background: #2864E6;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-family: var(--font);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .myesim-btn:hover { background: #4A90E8; }
    .myesim-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    /* NAV igual al home */
    .nav, .nav.scrolled {
      background: rgba(10,10,10,0.92) !important;
      backdrop-filter: blur(12px) !important;
      border-bottom: 1px solid rgba(255,255,255,0.07) !important;
    }
    .nav .logo-text { color: #2864E6 !important; font-weight: 700 !important; }
    .nav .logo-text strong { color: #C8C8C8 !important; font-weight:400 !important; }
    .nav .nav-links a { color: #B0B0B0 !important; }
    .nav .nav-links a:hover { color: #fff !important; }
    .nav .lang-toggle { background: rgba(255,255,255,0.1) !important; color: #fff !important; border: 1px solid rgba(255,255,255,0.15) !important; }
    .nav .nav-hamburger span { background: #fff !important; }
    /* Body en negro puro */
    body { background: #16223F !important; }

    .myesim-result {
      margin-top: 32px;
      display: none;
      animation: fadeUp 0.4s ease both;
    }
    .myesim-qr-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      overflow: hidden;
    }
    .myesim-qr-header {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      text-align: left;
    }
    .myesim-qr-header h3 { color: white; font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
    .myesim-qr-header p { color: rgba(255,255,255,0.4); font-size: 0.82rem; }
    .myesim-qr-display {
      padding: 36px;
      display: flex;
      justify-content: center;
      background: rgba(255,255,255,0.03);
    }
    .myesim-qr-display img {
      max-width: 200px;
      border-radius: 12px;
      border: 6px solid rgba(255,255,255,0.1);
    }
    .myesim-actions {
      padding: 20px 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .myesim-dl-btn {
      background: rgba(255,255,255,0.1);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50px;
      padding: 10px 20px;
      font-family: var(--font);
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .myesim-dl-btn:hover { background: rgba(255,255,255,0.18); }

    .myesim-error {
      background: rgba(255,80,80,0.08);
      border: 1px solid rgba(255,80,80,0.2);
      border-radius: 12px;
      padding: 16px;
      color: rgba(255,150,150,0.9);
      font-size: 0.88rem;
      margin-top: 16px;
      display: none;
    }
    .myesim-loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 40px;
      color: rgba(255,255,255,0.5);
      font-size: 0.88rem;
    }
    .spinner-white {
      width: 32px; height: 32px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: rgba(255,255,255,0.6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
  </style>

<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo ir-logo"></a>
      <div class="nav-links">
        <a href="catalog.html">Planes</a>
        <a href="recharge.html" data-i18n="nav_topup">Recargas</a>
        <button id="lang-toggle" class="lang-toggle">EN</button>
      </div>
      <div class="nav-right-mobile">
        <button id="lang-toggle-mobile" class="lang-toggle">EN</button>
        <button class="nav-hamburger" id="hamburger"><span></span><span></span><span></span></button>
      </div>
    </div>
  </nav>

  <section class="myesim-section">
    <div class="myesim-inner">
      <p class="apple-eyebrow" style="color:rgba(255,255,255,0.4);" id="myesim-tag">Mi eSIM</p>
      <h1 class="apple-headline" style="font-size:clamp(2rem,5vw,3rem);">
        <span id="myesim-title">Recupera tu</span><br/>
        <em id="myesim-title2">código QR</em>
      </h1>
      <p class="apple-subhead" style="font-size:0.9rem;" id="myesim-sub">
        Ingresa tu ID de transacción para descargar tu QR nuevamente
      </p>

      <div class="myesim-form">
        <label class="myesim-label" id="myesim-tx-label">ID de transacción</label>
        <input
          type="text"
          class="myesim-input"
          id="tx-input"
          placeholder="IR-XXXXXXXX-XXXXXX"
        />
        <label class="myesim-label" id="myesim-email-label">Tu correo electrónico</label>
        <input
          type="email"
          class="myesim-input"
          id="email-input"
          placeholder="tu@email.com"
          data-clarity-mask="true"
        />
        <button class="myesim-btn" id="retrieve-btn" onclick="retrieveESIM()">
          <span id="retrieve-btn-text">Recuperar QR</span>
        </button>
        <div class="myesim-error" id="myesim-error"></div>
      </div>

      <!-- Loading -->
      <div class="myesim-loading" id="myesim-loading">
        <div class="spinner-white"></div>
        <p id="myesim-loading-text">Buscando tu eSIM...</p>
      </div>

      <!-- Result -->
      <div class="myesim-result" id="myesim-result">
        <div class="myesim-qr-card">
          <div class="myesim-qr-header">
            <h3 id="result-plan-name">Plan eSIM</h3>
            <p id="result-tx-id"></p>
          </div>
          <div class="myesim-qr-display">
            <img id="result-qr-img" src="" alt="QR Code" />
          </div>
          <div class="myesim-actions">
            <button class="myesim-dl-btn" id="download-btn">⬇️ <span id="download-btn-text">Descargar QR</span></button>
            <button class="myesim-dl-btn" id="resend-email-btn" onclick="resendEmail()">📧 <span id="resend-btn-text">Reenviar por email</span></button>
            <a href="catalog.html" class="myesim-dl-btn" id="buy-more-btn">+ Comprar otro plan</a>
          </div>
        </div>
        <div id="resend-status" style="display:none;margin-top:12px;font-size:0.82rem;text-align:center;"></div>
        <p style="margin-top:20px;font-size:0.78rem;color:rgba(255,255,255,0.3);" id="result-note">
          ¿Problemas? Escríbenos a <a href="mailto:sales@infinity-roam.com" style="color:rgba(255,255,255,0.5);">sales@infinity-roam.com</a>
        </p>
      </div>

    </div>
  </section>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="zendit.js"></script>
  <script src="countries.js"></script>
  <script src="logo.js"></script>
  <script src="whatsapp.js"></script>
  <script>
  let currentQrBase64 = null;
  let currentTxId = null;
  let currentEmail = null;
  let currentPlanPrice = "";

  async function retrieveESIM() {
    const txId = document.getElementById("tx-input").value.trim();
    const email = document.getElementById("email-input").value.trim();
    const errorEl = document.getElementById("myesim-error");
    const loadingEl = document.getElementById("myesim-loading");
    const resultEl = document.getElementById("myesim-result");

    errorEl.style.display = "none";
    resultEl.style.display = "none";

    const lang = localStorage.getItem("ir_lang") || "es";

    if (!txId) {
      errorEl.textContent = lang === "es" ? "Por favor ingresa tu ID de transacción." : "Please enter your transaction ID.";
      errorEl.style.display = "block";
      return;
    }

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      errorEl.textContent = lang === "es" ? "Por favor ingresa un email válido." : "Please enter a valid email.";
      errorEl.style.display = "block";
      return;
    }

    document.getElementById("retrieve-btn").disabled = true;
    loadingEl.style.display = "flex";

    try {
      // Obtener datos de la transacción
      const tx = await ZenditAPI.getTransaction(txId);
      if (!tx || tx.error) throw new Error("Transacción no encontrada");

      // Obtener QR
      const qrData = await ZenditAPI.getQRCode(txId);
      console.log("[my-esim] QR response:", JSON.stringify(qrData));
      const qrBase64 =
        qrData.imageBase64 ||
        qrData.qrCode ||
        qrData.image ||
        qrData.qr ||
        qrData.qrImage ||
        qrData.base64 ||
        (qrData.esim && qrData.esim.imageBase64) ||
        (qrData.data && qrData.data.imageBase64) ||
        null;

      if (!qrBase64) throw new Error("QR no disponible aún — la eSIM puede estar procesándose");

      // Mostrar resultado
      loadingEl.style.display = "none";
      resultEl.style.display = "block";

      document.getElementById("result-plan-name").textContent = tx.offerId || "Plan eSIM";
      document.getElementById("result-tx-id").textContent = `ID: ${txId}`;

      const qrSrc = `data:image/png;base64,${qrBase64}`;
      document.getElementById("result-qr-img").src = qrSrc;

      // Guardar para reenvío
      currentQrBase64 = qrBase64;
      currentTxId = txId;
      currentEmail = email;
      // Leer el precio real pagado por el cliente desde localStorage
      try {
        const stored = localStorage.getItem(`ir_price_${txId}`);
        if (stored) {
          const data = JSON.parse(stored);
          if (data.price && !isNaN(data.price)) {
            currentPlanPrice = `$${parseFloat(data.price).toFixed(2)} USD`;
          }
        }
      } catch(e) {
        currentPlanPrice = "";
      }
      
      // Activation code para deep link
      // Estructura real confirmada de Zendit: viene anidado en "confirmation".
      const activationCode = 
        (qrData.confirmation && qrData.confirmation.activationCode) ||
        qrData.activationCode || qrData.manualCode ||
        (qrData.esim && qrData.esim.activationCode) || "";
      const smdpAddress =
        (qrData.confirmation && qrData.confirmation.smdpAddress) ||
        qrData.smdpAddress || qrData.smDpAddress ||
        (qrData.esim && qrData.esim.smdpAddress) || "";
      
      // Mostrar botón de instalación directa si hay activation code
      if (activationCode && smdpAddress) {
        showDirectInstallButton(smdpAddress, activationCode);
      }

      // Botón de descarga
      document.getElementById("download-btn").addEventListener("click", () => {
        const a = document.createElement("a");
        a.href = qrSrc;
        a.download = `infinityroam-${txId}.png`;
        a.click();
      });

    } catch (err) {
      loadingEl.style.display = "none";
      errorEl.textContent = lang === "es"
        ? `No pudimos encontrar tu eSIM. Verifica tu ID de transacción o contáctanos. (${err.message})`
        : `We couldn't find your eSIM. Verify your transaction ID or contact us. (${err.message})`;
      errorEl.style.display = "block";
    }

    document.getElementById("retrieve-btn").disabled = false;
  }

  document.getElementById("tx-input").addEventListener("keypress", (e) => {
    if (e.key === "Enter") document.getElementById("email-input").focus();
  });
  document.getElementById("email-input").addEventListener("keypress", (e) => {
    if (e.key === "Enter") retrieveESIM();
  });

  // El toggle de idioma ya está manejado globalmente por i18n.js.

  // Menú hamburguesa (móvil)
  const hamburger = document.getElementById("hamburger");
  const navLinksEl = document.querySelector(".nav-links");
  if (hamburger && navLinksEl) {
    hamburger.addEventListener("click", () => navLinksEl.classList.toggle("open"));
    navLinksEl.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => navLinksEl.classList.remove("open"));
    });
  }

  function showDirectInstallButton(smdpAddress, activationCode) {
    const lpaCode = `LPA:1$${smdpAddress}$${activationCode}`;
    const lang = localStorage.getItem("ir_lang") || "es";

    // Detectar plataforma
    const ua = navigator.userAgent || "";
    const isIOS = /iPad|iPhone|iPod/.test(ua);
    const isAndroid = /Android/.test(ua);

    // Links específicos por plataforma
    const iosLink = `https://esimsetup.apple.com/esim_qrcode_provisioning?carddata=${encodeURIComponent(lpaCode)}`;
    const androidLink = `lpa:1$${smdpAddress}$${activationCode}`;

    const actionsDiv = document.querySelector(".myesim-actions");
    if (!actionsDiv) return;

    // Quitar botón anterior si existe
    document.getElementById("direct-install-btn")?.remove();
    document.getElementById("install-note")?.remove();

    if (isIOS) {
      // Botón iOS
      const btn = document.createElement("a");
      btn.id = "direct-install-btn";
      btn.href = iosLink;
      btn.style.cssText = "display:inline-block;background:#007AFF;color:white;padding:12px 20px;border-radius:50px;text-decoration:none;font-size:0.85rem;font-weight:600;margin:8px 4px;";
      btn.innerHTML = "📲 " + (lang === "es" ? "Instalar en iPhone" : "Install on iPhone");
      actionsDiv.insertBefore(btn, actionsDiv.firstChild);

      const note = document.createElement("p");
      note.id = "install-note";
      note.style.cssText = "font-size:0.72rem;color:rgba(255,255,255,0.4);margin-top:8px;text-align:center;";
      note.textContent = lang === "es"
        ? "📱 Toca el botón azul para instalar la eSIM directamente sin escanear el QR (iOS 16+)"
        : "📱 Tap the blue button to install eSIM directly without scanning (iOS 16+)";
      actionsDiv.after(note);

    } else if (isAndroid) {
      // Botón Android
      const btn = document.createElement("a");
      btn.id = "direct-install-btn";
      btn.href = androidLink;
      btn.style.cssText = "display:inline-block;background:#3DDC84;color:#000;padding:12px 20px;border-radius:50px;text-decoration:none;font-size:0.85rem;font-weight:600;margin:8px 4px;";
      btn.innerHTML = "📲 " + (lang === "es" ? "Instalar en Android" : "Install on Android");
      actionsDiv.insertBefore(btn, actionsDiv.firstChild);

      const note = document.createElement("p");
      note.id = "install-note";
      note.style.cssText = "font-size:0.72rem;color:rgba(255,255,255,0.4);margin-top:8px;text-align:center;";
      note.textContent = lang === "es"
        ? "📱 Toca el botón verde para instalar la eSIM directamente sin escanear el QR"
        : "📱 Tap the green button to install eSIM directly without scanning";
      actionsDiv.after(note);

    } else {
      // Desktop — mostrar ambos links + instrucción de escanear
      const div = document.createElement("div");
      div.id = "direct-install-btn";
      div.style.cssText = "margin:8px 0;padding:12px;background:rgba(255,255,255,0.05);border-radius:12px;font-size:0.78rem;text-align:center;";
      div.innerHTML = `
        <p style="color:rgba(255,255,255,0.6);margin:0 0 8px;">
          ${lang === "es" ? "📱 Para instalar sin escanear, abre este link desde tu teléfono:" : "📱 To install without scanning, open this link from your phone:"}
        </p>
        <a href="${iosLink}" style="color:#007AFF;display:block;margin:4px 0;">🍎 iPhone (iOS 16+)</a>
        <a href="${androidLink}" style="color:#3DDC84;display:block;margin:4px 0;">🤖 Android</a>
      `;
      actionsDiv.after(div);
    }
  }

  async function resendEmail() {
    const btn = document.getElementById("resend-email-btn");
    const statusEl = document.getElementById("resend-status");
    // Fallback: leer email del input si la variable global está vacía
    if (!currentEmail) {
      currentEmail = document.getElementById("email-input")?.value?.trim() || null;
    }
    if (!currentTxId) {
      currentTxId = document.getElementById("tx-input")?.value?.trim() || null;
    }

    if (!currentQrBase64 || !currentEmail) {
      if(statusEl){statusEl.textContent="Recupera el QR primero.";statusEl.style.color="#ff6b6b";statusEl.style.display="block";}
      return;
    }
    btn.disabled = true;
    document.getElementById("resend-btn-text").textContent = "Enviando...";
    if(statusEl) statusEl.style.display = "none";
    try {
      const resp = await fetch("/.netlify/functions/send-email", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          to_email: currentEmail,
          to_name: currentEmail.split("@")[0],
          plan_name: document.getElementById("result-plan-name")?.textContent || "Plan eSIM",
          plan_price: currentPlanPrice, transaction_id: currentTxId,
          store_name: "Infinity Roam", support_email: "sales@infinity-roam.com",
          recovery_url: `https://infinity-roam.com/my-esim.html?id=${currentTxId}`,
          activation_code: "", smdp_address: "",
          qr_image: currentQrBase64 && currentQrBase64.length < 40000 ? `data:image/png;base64,${currentQrBase64}` : "",
        })
      });
      if (!resp.ok) throw new Error(await resp.text());
      if(statusEl){statusEl.textContent=`✅ Email enviado a ${currentEmail}`;statusEl.style.color="#4caf50";statusEl.style.display="block";}
      document.getElementById("resend-btn-text").textContent = "Enviado ✓";
      // Resetear botón después de 3 segundos para permitir reenvíos
      setTimeout(() => {
        btn.disabled = false;
        document.getElementById("resend-btn-text").textContent = "Reenviar por email";
      }, 3000);
    } catch(err) {
      console.error("[resend]",err);
      if(statusEl){statusEl.textContent="Error al enviar. Escríbenos a sales@infinity-roam.com";statusEl.style.color="#ff6b6b";statusEl.style.display="block";}
      btn.disabled = false;
      document.getElementById("resend-btn-text").textContent = "Reenviar por email";
    }
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
  }
  </script>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Mantenimiento — Infinity Roam</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"/>
  <style>
    *{box-sizing:border-box;margin:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0a0a0a;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;text-align:center}
    main{max-width:460px}
    img{height:40px;width:auto;margin:0 auto 36px;display:block}
    h1{font-size:1.6rem;line-height:1.25;margin-bottom:14px}
    p{color:#b8b8c0;line-height:1.6;margin-bottom:12px;font-size:1rem}
    a{color:#5aa0ff;text-decoration:none}
    .box{margin-top:26px;padding:16px 18px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.04);font-size:.92rem}
  </style>
</head>
<body>
  <main>
    <img src="/images/logo.png" alt="Infinity Roam" width="162" height="34"/>
    <h1 id="t">Estamos en mantenimiento</h1>
    <p id="p1">Estamos resolviendo un inconveniente con uno de nuestros proveedores. Por seguridad, las compras están pausadas temporalmente.</p>
    <p id="p2">Volveremos muy pronto. Gracias por tu paciencia.</p>
    <div class="box" id="b">¿Ya compraste y tienes dudas sobre tu eSIM o recarga? Escríbenos a <a href="mailto:sales@infinity-roam.com">sales@infinity-roam.com</a>.</div>
  </main>
  <script>
    if (/^en/i.test(navigator.language || "")) {
      document.documentElement.lang = "en";
      document.title = "Maintenance — Infinity Roam";
      document.getElementById("t").textContent = "We're under maintenance";
      document.getElementById("p1").textContent = "We're resolving an issue with one of our providers. For your safety, purchases are temporarily paused.";
      document.getElementById("p2").textContent = "We'll be back very soon. Thanks for your patience.";
      document.getElementById("b").innerHTML = 'Already purchased and have questions about your eSIM or top-up? Write to us at <a href="mailto:sales@infinity-roam.com">sales@infinity-roam.com</a>.';
    }
  </script>
</body>
</html>
